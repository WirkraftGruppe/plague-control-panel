openapi: 3.0.3
info:
  title: API de Detach
  version: 1.0.0
  description: API de la app móvil de los empleados de MAControl S.A.
paths:
  /api/v1/:
    get:
      operationId: root_retrieve
      description: 'Con los permisos por defecto: anónimo 401, autenticado ve su rol.'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: Intercambia usuario y contraseña por un par de tokens JWT.
      summary: Obtener tokens
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenNormalizadoRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
          description: ''
        '401':
          description: Credenciales inválidas o cuenta inactiva.
        '415':
          description: El cuerpo no es JSON (`Content-Type`).
        '429':
          description: Demasiados intentos; reintentar más tarde.
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Entrega un nuevo token de acceso y un nuevo token de renovación;
        el token de renovación enviado queda invalidado, así que hay que guardar el
        nuevo. Falla si el usuario ya no existe o cambió su contraseña.
      summary: Renovar el token de acceso
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenovacionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
          description: ''
        '401':
          description: Token de renovación inválido o vencido.
        '415':
          description: El cuerpo no es JSON (`Content-Type`).
        '429':
          description: Demasiados intentos; reintentar más tarde.
  /api/v1/fotos/{codigo}/:
    get:
      operationId: fotos_retrieve
      description: Devuelve el JPEG; 404 si no existe y 403 si no corresponde.
      summary: Descargar una foto
      parameters:
      - in: path
        name: codigo
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - fotos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          description: ''
        '403':
          description: La foto es de otro empleado.
        '404':
          description: La foto no existe.
  /api/v1/me/historial/:
    get:
      operationId: me_historial_list
      description: Lista paginada; `desde` y `hasta` son inclusivos (fecha local).
      summary: Mi historial de visitas realizadas
      parameters:
      - in: query
        name: desde
        schema:
          type: string
          format: date
        description: AAAA-MM-DD
      - in: query
        name: hasta
        schema:
          type: string
          format: date
        description: AAAA-MM-DD
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: tamano
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVisitaRealizadaList'
          description: ''
  /api/v1/me/puntos/:
    get:
      operationId: me_puntos_list
      description: Puntos activos, con coordenadas y estado, de los sitios activos
        (de clientes activos) donde el empleado tiene visitas pendientes o abiertas.
        `sitio` filtra por id; un sitio ajeno devuelve lista vacía.
      summary: Mis puntos de control
      parameters:
      - in: query
        name: sitio
        schema:
          type: integer
        description: Id del sitio.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MiPunto'
          description: ''
  /api/v1/me/visitas/:
    get:
      operationId: me_visitas_list
      description: |-
        Lista paginada; las abiertas van primero y cada una trae su `estado` y
        los `items` (punto y servicio) del turno.
      summary: Mis visitas pendientes y abiertas
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: tamano
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVisitaActivaList'
          description: ''
  /api/v1/planos/{id}/imagen/:
    get:
      operationId: planos_imagen_retrieve
      description: 'Administradores, o empleados con una visita propia pendiente o
        abierta en el sitio. Sin acceso, plano inactivo o inexistente: el mismo 404.'
      summary: Descargar la imagen de un plano
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - planos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            image/png:
              schema:
                type: string
                format: binary
          description: ''
        '404':
          description: El plano no existe o no es accesible.
  /api/v1/productos/:
    get:
      operationId: productos_list
      description: Lista completa y sin paginar de los productos activos. Devuelve
        un `ETag`; con `If-None-Match` igual responde 304 sin cuerpo.
      summary: Catálogo de productos activos
      tags:
      - productos
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
          description: ''
        '304':
          description: El catálogo no cambió.
  /api/v1/puntos/{id}/ubicacion/:
    post:
      operationId: puntos_ubicacion_create
      description: Solo administradores. Reemplaza las coordenadas y descarta la ubicación
        propuesta; `precision_m` no puede superar `PRECISION_MAXIMA_M`.
      summary: Fijar la ubicación de un punto en campo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - puntos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UbicacionPuntoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UbicacionPuntoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UbicacionPuntoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntoCampo'
          description: ''
        '400':
          description: Datos inválidos o precisión de GPS insuficiente.
        '403':
          description: Solo administradores.
        '404':
          description: No existe.
  /api/v1/qr/{codigo}/resolver/:
    post:
      operationId: qr_resolver_create
      description: 'Empleados y administradores. Un QR inexistente, de un punto o
        sitio inactivo o de un cliente inactivo responde el mismo 404. El punto trae
        su `estado` y `proximo_vencimiento`, `en_turno` (tiene un ítem en un turno
        propio) y el `servicio` con sus esquemas de planilla (`null` si no tiene).
        `visita_destino` es el id de la visita en la que se guardaría la revisión
        (la abierta propia del sitio o, si no hay, la pendiente más antigua) y `null`
        si al abrir se crearía una nueva. El servicio y `en_turno` se calculan sobre
        la visita destino: el del ítem del punto en ella o, si no lo tiene, el del
        punto con `en_turno` falso.'
      summary: Resolver un código QR
      parameters:
      - in: path
        name: codigo
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - qr
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolverQR'
          description: ''
  /api/v1/revisiones/:
    post:
      operationId: revisiones_create
      description: Multipart. `qr_codigo` es el del punto escaneado. `datos` y `productos_aplicados`
        son texto JSON, una lista donde cada ítem lleva `producto`, `lote`, `dosis`,
        `unidad_dosis`, `cantidad` y `unidad` (la unidad de la cantidad, válida para
        el producto); `fotos` se repite de 0 a 2 veces (hasta 8 MB cada una). Un `cliente_uuid`
        ya registrado responde 409; `revision` y `visita` solo vienen si son del mismo
        empleado. Un administrador que escanea un punto sin coordenadas, con precisión
        de a lo sumo 50 m, las fija.
      summary: Registrar una revisión
      tags:
      - revisiones
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CrearRevisionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
          description: ''
        '400':
          description: 'Validación: QR que no es de un punto del sitio, visita no
            abierta, coordenadas faltantes, punto sin servicio, planilla inválida
            o revisión con más horas de atraso que el máximo (168 por defecto).'
        '404':
          description: La visita no existe o es de otro usuario.
        '409':
          description: El `cliente_uuid` ya fue registrado.
        '413':
          description: El pedido supera el tamaño permitido.
  /api/v1/sitios/:
    post:
      operationId: sitios_create
      description: Solo administradores. Cliente activo, coordenadas y `precision_m`
        obligatorios; la precisión no puede superar `PRECISION_MAXIMA_M`.
      summary: Crear un sitio en campo
      tags:
      - sitios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AltaSitioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AltaSitioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AltaSitioRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitioCampo'
          description: ''
        '400':
          description: Datos inválidos o precisión de GPS insuficiente.
        '403':
          description: Solo administradores.
        '404':
          description: No existe.
  /api/v1/sitios/{id}/puntos/:
    post:
      operationId: sitios_puntos_create
      description: Solo administradores. Sin coordenadas el punto nace sin ubicación;
        con ellas, `precision_m` es obligatoria y no puede superar `PRECISION_MAXIMA_M`.
        La foto es opcional (multipart). Un pedido mayor que una foto más 1 MiB, o
        con demasiados campos, da 400.
      summary: Crear un punto de control en campo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - sitios
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AltaPuntoRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AltaPuntoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntoCampo'
          description: ''
        '400':
          description: Datos inválidos o precisión de GPS insuficiente.
        '403':
          description: Solo administradores.
        '404':
          description: No existe.
  /api/v1/visitas/{id}/cerrar/:
    post:
      operationId: visitas_cerrar_create
      description: '`datos` es la planilla de ámbito visita; todo es opcional. Cerrar
        de nuevo una visita que ya cerró el mismo usuario devuelve 200 con la visita;
        si la cerró el sistema o un administrador, 409. Cerrar la visita de un administrador
        no cuenta como servicio.'
      summary: Cerrar una visita
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - visitas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CerrarVisitaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CerrarVisitaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CerrarVisitaRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitaRealizada'
          description: ''
        '400':
          description: No está abierta, no tiene revisiones o la planilla es inválida.
        '404':
          description: La visita no existe o es de otro usuario.
        '409':
          description: La visita ya la cerró el sistema o un administrador.
  /api/v1/visitas/abrir/:
    post:
      operationId: visitas_abrir_create
      description: 'Abre el turno pendiente más antiguo del empleado en el sitio del
        QR o crea una visita sin ítems. `qr_codigo` es el de un punto activo. Si el
        empleado ya tiene una abierta en el sitio la devuelve con 200. `latitud`,
        `longitud` y `precision_m` son opcionales: con coordenadas se guarda la distancia
        al punto y la incidencia de ubicación, sin rechazar nunca por distancia. La
        visita de un administrador no toma pendientes.'
      summary: Abrir una visita
      tags:
      - visitas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbrirVisitaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AbrirVisitaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AbrirVisitaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitaActiva'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitaActiva'
          description: ''
        '400':
          description: QR inexistente, de un punto o sitio inactivo.
components:
  schemas:
    AbrirVisitaRequest:
      type: object
      description: |-
        Entrada de `POST visitas/abrir/`: el QR escaneado en el sitio y, opcionales,
        las coordenadas del teléfono para verificar la ubicación.
      properties:
        qr_codigo:
          type: string
          format: uuid
        latitud:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitud:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        precision_m:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,1})?$
          nullable: true
      required:
      - qr_codigo
    AltaPuntoRequest:
      type: object
      description: Alta de un punto; las coordenadas (con su precisión) y la foto
        son opcionales.
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        sector:
          type: string
          default: ''
          maxLength: 100
        latitud:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitud:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        precision_m:
          type: number
          format: double
          minimum: 0
        foto:
          type: string
          format: binary
      required:
      - nombre
    AltaSitioRequest:
      type: object
      description: Alta de un sitio por un administrador en campo; coordenadas obligatorias.
      properties:
        cliente:
          type: integer
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        direccion:
          type: string
          maxLength: 255
        localidad:
          type: string
          maxLength: 100
        latitud:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitud:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        precision_m:
          type: number
          format: double
          minimum: 0
      required:
      - cliente
      - latitud
      - longitud
      - nombre
      - precision_m
    CampoEsquema:
      type: object
      description: Campo de la planilla de un servicio, tal como lo arma `esquema_planilla`.
      properties:
        clave:
          type: string
        etiqueta:
          type: string
        tipo:
          type: string
        opciones:
          type: array
          items: {}
        obligatorio:
          type: boolean
        ayuda:
          type: string
        orden:
          type: integer
      required:
      - ayuda
      - clave
      - etiqueta
      - obligatorio
      - opciones
      - orden
      - tipo
    CerrarVisitaRequest:
      type: object
      description: 'Entrada de `POST visitas/<pk>/cerrar/`: planilla de la visita
        y observaciones.'
      properties:
        datos: {}
        observaciones:
          type: string
          maxLength: 2000
        incidencia:
          type: boolean
        incidencia_detalle:
          type: string
          maxLength: 2000
    ClienteQR:
      type: object
      properties:
        razon_social:
          type: string
      required:
      - razon_social
    CrearRevisionRequest:
      type: object
      description: |-
        Forma y límites de una revisión; las reglas de negocio (incluido el atraso,
        que respeta la idempotencia) las aplica el servicio.
      properties:
        visita:
          type: integer
        qr_codigo:
          type: string
          format: uuid
        cliente_uuid:
          type: string
          format: uuid
        realizada_en:
          type: string
          format: date-time
        latitud:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitud:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        precision_m:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,1})?$
          nullable: true
        datos:
          type: string
          minLength: 1
          maxLength: 50000
        productos_aplicados:
          type: string
          minLength: 1
          maxLength: 50000
        fotos:
          type: array
          items:
            type: string
            format: binary
          maxItems: 2
        observaciones:
          type: string
          default: ''
          maxLength: 2000
        incidencia:
          type: boolean
          default: false
        incidencia_detalle:
          type: string
          default: ''
          maxLength: 2000
      required:
      - cliente_uuid
      - latitud
      - longitud
      - qr_codigo
      - realizada_en
      - visita
    EstadoEnum:
      enum:
      - pendiente
      - abierta
      - realizada
      - cancelada
      type: string
      description: |-
        * `pendiente` - Pendiente
        * `abierta` - Abierta
        * `realizada` - Realizada
        * `cancelada` - Cancelada
    ItemTurno:
      type: object
      description: Punto del turno con su servicio; `revisado` si ya tiene una revisión.
      properties:
        punto:
          $ref: '#/components/schemas/PuntoItem'
        servicio:
          $ref: '#/components/schemas/ServicioResumen'
        revisado:
          type: boolean
      required:
      - punto
      - revisado
      - servicio
    MiPunto:
      type: object
      description: Punto activo de un sitio donde el empleado tiene trabajo, con su
        estado.
      properties:
        id:
          type: integer
        nombre:
          type: string
        sector:
          type: string
        sitio:
          $ref: '#/components/schemas/SitioPunto'
        plano:
          type: integer
          nullable: true
        x:
          type: number
          format: double
          nullable: true
        y:
          type: number
          format: double
          nullable: true
        latitud:
          type: number
          format: double
          nullable: true
        longitud:
          type: number
          format: double
          nullable: true
        estado:
          type: string
      required:
      - estado
      - id
      - latitud
      - longitud
      - nombre
      - plano
      - sector
      - sitio
      - x
      - y
    ModoUnidadEnum:
      enum:
      - unica
      - equivalentes
      type: string
      description: |-
        * `unica` - Solo la unidad base
        * `equivalentes` - Unidades equivalentes
    PaginatedVisitaActivaList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/VisitaActiva'
    PaginatedVisitaRealizadaList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/VisitaRealizada'
    Plano:
      type: object
      description: Plano del punto escaneado; `url` apunta al endpoint autenticado
        de la imagen.
      properties:
        id:
          type: integer
        nombre:
          type: string
        url:
          type: string
        ancho_px:
          type: integer
        alto_px:
          type: integer
        puntos:
          type: array
          items:
            $ref: '#/components/schemas/PuntoPlano'
      required:
      - alto_px
      - ancho_px
      - id
      - nombre
      - puntos
      - url
    Producto:
      type: object
      description: Representación de solo lectura de un producto del catálogo.
      properties:
        id:
          type: integer
          readOnly: true
        nombre_comercial:
          type: string
          readOnly: true
        principio_activo:
          type: string
          readOnly: true
        registro:
          type: string
          readOnly: true
          description: Número de registro ANMAT/SENASA del producto.
        presentacion:
          type: string
          readOnly: true
          title: Presentación
        unidad_dosis_por_defecto:
          type: string
          readOnly: true
          title: Unidad de dosis por defecto
          description: 'Por ejemplo: ml/l.'
        unidad_base:
          allOf:
          - $ref: '#/components/schemas/UnidadBaseEnum'
          readOnly: true
          description: |-
            Unidad en que se lleva el stock.

            * `ml` - ml
            * `l` - l
            * `gal` - gal
            * `g` - g
            * `kg` - kg
            * `lb` - lb
            * `unidad` - unidad
        modo_unidad:
          allOf:
          - $ref: '#/components/schemas/ModoUnidadEnum'
          readOnly: true
          title: Modo de unidad
        unidades_permitidas:
          type: array
          items:
            type: string
          description: Unidades en que se puede cargar la cantidad aplicada.
          readOnly: true
      required:
      - id
      - modo_unidad
      - nombre_comercial
      - presentacion
      - principio_activo
      - registro
      - unidad_base
      - unidad_dosis_por_defecto
      - unidades_permitidas
    ProductoAplicado:
      type: object
