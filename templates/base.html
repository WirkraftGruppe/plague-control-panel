{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Detach{% endblock %}</title>
  <style nonce="{{ request.csp_nonce }}">
    /* Fuentes servidas desde el propio sitio (subconjunto latin) */
    @font-face {
      font-family: "Barlow";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("{% static 'fonts/barlow-latin-400-normal.woff2' %}") format("woff2");
    }
    @font-face {
      font-family: "Barlow";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("{% static 'fonts/barlow-latin-500-normal.woff2' %}") format("woff2");
    }
    @font-face {
      font-family: "Barlow";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("{% static 'fonts/barlow-latin-600-normal.woff2' %}") format("woff2");
    }
    @font-face {
      font-family: "Barlow";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("{% static 'fonts/barlow-latin-700-normal.woff2' %}") format("woff2");
    }

    /* Tokens del sistema visual neutro de Detach (docs/02-diseno.md) */
    :root {
      --bg: #F5F6F7;
      --surface: #FFFFFF;
      --surface-2: #EEF0F2;
      --border: #DFE2E6;
      --border-strong: #C5CAD1;
      --text: #1A1E23;
      --text-muted: #545C66;
      --text-faint: #646C76;

      --accion: #1F5FD1;
      --accion-hover: #174AA6;
      --sobre-accion: #FFFFFF;
      --activo-fondo: #EAF1FD;
      --activo-texto: #1F5FD1;

      --vencido-punto: #D92D20;
      --vencido-fondo: #FDECEA;
      --vencido-texto: #B42318;
      --proximo-punto: #E0A100;
      --proximo-fondo: #FFF4D6;
      --proximo-texto: #7A4F00;
      --al-dia-punto: #2E9E5B;
      --al-dia-fondo: #E6F4EC;
      --al-dia-texto: #1B6B3C;
      --sin-fecha-punto: #9AA1A9;
      --sin-fecha-fondo: #EEF0F2;
      --sin-fecha-texto: #4A525B;

      --radio-control: 6px;
      --radio-bloque: 8px;
      --radio-chip: 999px;
      --ancho-barra: 232px;

      /* Alias de los puntos de estado para hojas de otras apps */
      --ok: var(--al-dia-punto);
      --warn: var(--proximo-punto);
      --danger: var(--vencido-punto);
      --neutral: var(--sin-fecha-punto);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Barlow", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    h1, h2, h3 { font-weight: 700; }

    a { color: var(--accion); }
    a:hover { color: var(--accion-hover); }

    .logo { display: block; height: 40px; width: auto; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block encabezado %}<header>
    <a href="/"><img class="logo" src="{% static 'img/logo.png' %}" alt="{{ NOMBRE_EMPRESA }}"></a>
  </header>{% endblock %}
  <main>
    {% block contenido %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
