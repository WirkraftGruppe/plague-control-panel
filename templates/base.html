{% load static %}<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Detach{% endblock %}</title>
  <style nonce="{{ request.csp_nonce }}">
    /* Fuentes servidas desde el propio sitio (subconjunto latin) */
    @font-face {
      font-family: "Barlow";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("{% static 'fonts/barlow-latin-400-normal.woff2' %}") format("woff2");
    }
    @font-face {
      font-family: "Barlow";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("{% static 'fonts/barlow-latin-500-normal.woff2' %}") format("woff2");
    }
    @font-face {
      font-family: "Barlow";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("{% static 'fonts/barlow-latin-600-normal.woff2' %}") format("woff2");
    }
    @font-face {
      font-family: "Barlow";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("{% static 'fonts/barlow-latin-700-normal.woff2' %}") format("woff2");
    }
    @font-face {
      font-family: "Barlow Condensed";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("{% static 'fonts/barlow-condensed-latin-600-normal.woff2' %}") format("woff2");
    }
    @font-face {
      font-family: "Barlow Condensed";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("{% static 'fonts/barlow-condensed-latin-700-normal.woff2' %}") format("woff2");
    }
    @font-face {
      font-family: "Barlow Condensed";
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url("{% static 'fonts/barlow-condensed-latin-800-normal.woff2' %}") format("woff2");
    }

    /* Colores de estado */
    :root {
      --ok: #2e9e5b;
      --warn: #ffc600;
      --danger: #d9463e;
      --neutral: #7f8890;
    }

    /* Tema claro (panel de gestión) */
    [data-tema="claro"] {
      --bg: #f4f3ef;
      --surface: #ffffff;
      --surface-2: #eceae4;
      --border: #d9d6cf;
      --border-strong: #b9b5ab;
      --text: #15191c;
      --text-muted: #4f565c;
      --text-faint: #7f8890;
      --brand: #ffc600;
      --brand-hover: #e6b200;
      --on-brand: #0f1417;
      --on-brand-muted: #3a3410;
      --brand-tint: #fff7d6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Barlow", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    h1, h2, h3 {
      font-family: "Barlow Condensed", system-ui, sans-serif;
      font-weight: 700;
    }

    a { color: var(--brand); }
    a:hover { color: var(--brand-hover); }

    .logo { display: block; height: 40px; width: auto; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <a href="/"><img class="logo" src="{% static 'img/logo.png' %}" alt="{{ NOMBRE_EMPRESA }}"></a>
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
